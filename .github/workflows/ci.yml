name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beetlejuice_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/beetlejuice_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/beetlejuice_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Unit, integration and browser end-to-end tests (the runner image ships Google Chrome).
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      # Job logs need a GitHub login to read; annotations do not. On failure, surface the failing tests as one.
      - name: Surface failing tests as an annotation
        if: failure()
        run: |
          awk '/failing tests:/{f=1} f' test.log | head -c 12000 | python3 -c "import sys; t = sys.stdin.read() or 'npm test failed before the test summary (see the job log)'; print('::error title=Failing tests::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
